        <text id="heading_direction" x="312" y="457" text-anchor="middle" class="compass-caption">ONO</text>
        <text id="heading_code" x="312" y="491" text-anchor="middle" class="compass-code">HDG</text>
      </g>
    </g>
  </svg>

