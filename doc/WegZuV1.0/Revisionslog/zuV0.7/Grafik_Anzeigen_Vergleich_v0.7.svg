<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="720" viewBox="0 0 1820 720" role="img" aria-labelledby="title desc">
  <title id="title">Vergleich der Instrumentanzeigen</title>
  <desc id="desc">Übersicht der Instrumentanzeigen. Kompass, Stampfen und Krängung sind als gleich gestaltete Karten enthalten und zusätzlich jeweils als Einzelgrafik verfügbar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102437"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="compass-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193448"/>
      <stop offset="1" stop-color="#11283a"/>
    </linearGradient>
    <filter id="compass-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #f4f8fb; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.7px; fill: #8da9bb; }
      .title { font-size: 25px; font-weight: 700; }
      .note { font-size: 13px; fill: #8da9bb; }
      .compass-card { fill: url(#compass-card); stroke: #315066; stroke-width: 1.5; }
      .compass-title { font-size: 19px; font-weight: 700; letter-spacing: 1.2px; fill: #b8cad5; }
      .compass-small { font-size: 13px; fill: #8da9bb; }
      .compass-value { font-size: 48px; font-weight: 700; }
      .compass-caption { font-size: 17px; fill: #9eb4c2; }
      .compass-code { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #8da9bb; }
      .compass-tick-minor { stroke: #49667a; stroke-width: 2; }
      .compass-tick-major { stroke: #7892a3; stroke-width: 2.7; }
      .compass-camera { fill: #11283a; stroke: #ffdf70; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1820" height="720" fill="url(#background)"/>
  <text x="24" y="38" class="eyebrow">SEGELPHYSIK · INSTRUMENTE</text>
  <text x="24" y="76" class="title">Vergleich der Anzeigen</text>
  <text x="24" y="101" class="note">Kompass · Stampfen · KRÄNGUNG</text>

