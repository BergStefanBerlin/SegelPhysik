<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Navigationsanzeigen für SegelPhysik</title>
  <desc id="desc">Eigenständiger Dashboard-Entwurf mit Weltkompass oben links, Fahrt über Grund oben rechts, Fahrt durchs Wasser unten links und deaktivierter Windkarte unten rechts. Alle Zahlen sind illustrative Beispiele, keine Simulationsergebnisse.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102437"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193448"/>
      <stop offset="1" stop-color="#11283a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5065" stop-opacity=".68"/>
      <stop offset="1" stop-color="#0c293b" stop-opacity=".14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".35"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ee2d0"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffc66d"/>
    </marker>
    <g id="tick_minor_22_5">
      <line x1="164" y1="180" x2="164" y2="190"/>
    </g>
    <g id="tick_major_45" fill="none" stroke="#7892a3" stroke-width="2">
      <line x1="164" y1="180" x2="164" y2="196"/>
    </g>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #f4f8fb; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.7px; fill: #8da9bb; }
      .screen-title { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
      .card-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #b8cad5; }
      .primary { font-size: 40px; font-weight: 700; }
      .secondary { font-size: 24px; font-weight: 650; }
      .unit { font-size: 15px; font-weight: 600; fill: #9eb4c2; }
      .caption { font-size: 13px; fill: #9eb4c2; }
      .small { font-size: 12px; fill: #8da9bb; }
      .dial-label { paint-order: stroke; stroke: #0b1c2a; stroke-width: 4px; stroke-linejoin: round; }
      .card { fill: url(#card); stroke: #315066; stroke-width: 1.2; }
      .hairline { stroke: #355368; stroke-width: 1; }
      .cyan { fill: #5ee2d0; }
      .gold { fill: #ffc66d; }
      .muted { fill: #8da9bb; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <path d="M0 466 C180 443 310 481 475 459 S780 443 940 466 S1250 481 1440 450 L1440 900 L0 900 Z" fill="url(#sea)"/>
  <path d="M0 488 C180 467 320 502 485 480 S790 465 958 489 S1250 503 1440 474" fill="none" stroke="#4c8293" stroke-opacity=".28" stroke-width="2"/>
  <path d="M0 534 C170 519 315 547 470 531 S790 512 956 539 S1260 550 1440 527" fill="none" stroke="#4c8293" stroke-opacity=".16" stroke-width="1.5"/>

  <g id="dashboard_header">
    <text x="36" y="38" class="eyebrow">SEGELPHYSIK · NAVIGATION</text>
    <text x="36" y="70" class="screen-title">Welt- und Körperbewegung</text>
    <g transform="translate(1164 43)">
      <circle r="5" fill="#5ee2d0"/>
      <text x="15" y="5" class="caption">Beispielansicht · Werte illustrativ</text>
    </g>
    <line x1="36" y1="84" x2="1404" y2="84" stroke="#294355" stroke-width="1"/>
  </g>

  <g id="world_heading_card" filter="url(#shadow)">
    <rect class="card" x="32" y="104" width="330" height="330" rx="18"/>
    <text x="56" y="137" class="card-title">KOMPASS</text>
    <text x="48" y="416" text-anchor="start" class="small" font-size="10">Bugrichtung relativ zu lokalem Nord</text>
    <g id="compass_rose"
       transform="translate(33 -2) translate(164 267) scale(1.45) translate(-164 -267)"
       aria-label="Kompassrose mit Nordreferenz">
      <circle cx="164" cy="267" r="87" fill="#0b1c2a" stroke="#49667a" stroke-width="1.5"/>
      <circle cx="164" cy="267" r="69" fill="none" stroke="#29485d" stroke-width="1"/>
      <g id="compass_ticks_22_5deg" fill="none" stroke="#49667a" stroke-width="1.5">
        <use href="#tick_minor_22_5" transform="rotate(22.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(67.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(112.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(157.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(202.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(247.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(292.5 164 267)"/>
        <use href="#tick_minor_22_5" transform="rotate(337.5 164 267)"/>
        <use href="#tick_major_45" transform="rotate(45 164 267)"/>
        <use href="#tick_major_45" transform="rotate(135 164 267)"/>
        <use href="#tick_major_45" transform="rotate(225 164 267)"/>
        <use href="#tick_major_45" transform="rotate(315 164 267)"/>
      </g>
      <g id="heading_marker" transform="rotate(74 164 267)">
        <path d="M164 207 L155 272 L164 264 L173 272 Z" fill="#ffc66d"/>
        <line x1="164" y1="267" x2="164" y2="210" stroke="#ffc66d" stroke-width="2"/>
      </g>
      <g id="camera_azimuth_marker" transform="rotate(119 164 267)"
         fill="#0b1c2a" stroke="#ffdf70" stroke-width="2" stroke-linejoin="round">
        <rect x="155" y="159" width="18" height="14" rx="3"/>
        <path d="M160 159 L162 156 L166 156 L168 159"/>
        <path d="M160 173 L164 179 L168 173 Z"/>
        <circle cx="164" cy="165" r="3.5" fill="none"/>
      </g>
      <g id="compass_cardinal_labels" class="small" text-anchor="middle">
        <text x="164" y="192" font-size="10" font-weight="700">N</text>
        <text x="242" y="271" font-size="11" font-weight="700">O</text>
        <text x="164" y="349" font-size="10" font-weight="700">S</text>
        <text x="86" y="271" font-size="11" font-weight="700">W</text>
      </g>
      <circle cx="164" cy="267" r="5" fill="#f4f8fb"/>
      <g id="heading_readout" text-anchor="middle">
        <text id="heading_value" x="164" y="242" class="primary dial-label">074<tspan class="unit">°</tspan></text>
        <text id="heading_direction" x="164" y="298" class="caption dial-label">ONO</text>
        <text id="heading_label" x="164" y="320" class="eyebrow dial-label">HDG</text>
      </g>
    </g>
  </g>

  <g id="ground_motion_card" filter="url(#shadow)">
    <rect class="card" x="1018" y="104" width="390" height="274" rx="18"/>
    <text x="1042" y="137" class="card-title">KÖRPER · ÜBER GRUND</text>
    <text x="1042" y="158" class="small">Translation des ausgewählten Rumpfs</text>
    <line x1="1042" y1="177" x2="1384" y2="177" class="hairline"/>
    <g id="sog_readout">
      <text x="1042" y="204" class="eyebrow">SOG</text>
      <text id="sog_value" x="1042" y="250" class="primary">3.2<tspan class="unit"> m/s</tspan></text>
      <text x="1042" y="272" class="caption">Geschwindigkeit über Grund</text>
    </g>
    <g id="cog_readout">
      <text x="1042" y="313" class="eyebrow">COG</text>
      <text id="cog_value" x="1110" y="317" class="secondary">061<tspan class="unit">°</tspan></text>
      <text x="1200" y="315" class="caption">Kurs über Grund</text>
    </g>
    <g id="cog_marker" transform="translate(1350 312) rotate(61)">
      <circle r="24" fill="#0b1c2a" stroke="#49667a" stroke-width="1"/>
      <path d="M0 -16 L-6 5 L0 1 L6 5 Z" fill="#5ee2d0"/>
      <circle r="3" fill="#f4f8fb"/>
    </g>
    <text x="1042" y="351" class="small">COG ist ein Weltazimut, kein Seitenwinkel</text>
  </g>

  <g id="scene_viewport" aria-label="Schematische Yachtansicht mit Bewegungsrichtungen">
    <text x="720" y="433" text-anchor="middle" class="eyebrow">AUSGEWÄHLTER KÖRPER</text>
    <path d="M600 502 C646 493 794 493 842 502 L816 535 C784 554 667 554 632 535 Z" fill="#d5e1e8" stroke="#f4f8fb" stroke-width="2"/>
    <path d="M628 508 C680 515 763 515 827 508" fill="none" stroke="#6f8999" stroke-width="2"/>
    <path d="M717 498 L717 454" stroke="#b6c7d1" stroke-width="3"/>
    <path d="M714 460 L655 493 L714 493 Z" fill="#edc77e" fill-opacity=".88" stroke="#fff0c6" stroke-width="1"/>
    <path d="M721 467 L772 493 L721 493 Z" fill="#d6e6ec" fill-opacity=".93" stroke="#fff" stroke-width="1"/>
    <circle cx="720" cy="517" r="5" fill="#153448"/>
    <line x1="720" y1="517" x2="720" y2="455" stroke="#91aebc" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-cyan)"/>
    <text x="730" y="463" class="small">Bug</text>
    <line id="sog_vector" x1="720" y1="517" x2="781" y2="457" stroke="#5ee2d0" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <line id="stw_vector" x1="720" y1="517" x2="778" y2="496" stroke="#ffc66d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <g transform="translate(576 579)">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#5ee2d0" stroke-width="3" marker-end="url(#arrow-cyan)"/>
      <text x="42" y="5" class="small">über Grund</text>
      <line x1="162" y1="0" x2="194" y2="0" stroke="#ffc66d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
      <text x="204" y="5" class="small">durch Wasser</text>
    </g>
    <text x="720" y="613" text-anchor="middle" class="small">Schematisch · Vektoren nicht maßstäblich</text>
  </g>

  <g id="water_motion_card" filter="url(#shadow)">
    <rect class="card" x="32" y="626" width="530" height="230" rx="18"/>
    <text x="56" y="659" class="card-title">KÖRPER · RELATIV ZUM WASSER</text>
    <text x="56" y="680" class="small">Rumpfbewegung gegenüber der lokalen Strömung</text>
    <line x1="56" y1="696" x2="538" y2="696" class="hairline"/>
    <g id="stw_readout">
      <text x="56" y="727" class="eyebrow">STW</text>
      <text id="stw_value" x="56" y="767" class="secondary">2.8<tspan class="unit"> m/s</tspan></text>
      <text x="56" y="792" class="caption">Betrag relativ zum Wasser</text>
    </g>
    <g id="ctw_readout">
      <text x="231" y="727" class="eyebrow">CTW</text>
      <text id="ctw_value" x="231" y="767" class="secondary">058<tspan class="unit">°</tspan></text>
      <text x="231" y="792" class="caption">Richtung durchs Wasser</text>
    </g>
    <g id="leeway_readout">
      <text x="399" y="727" class="eyebrow">λ · ABDRIFT</text>
      <text id="leeway_value" x="399" y="767" class="secondary">−16<tspan class="unit">°</tspan></text>
      <text x="399" y="792" class="caption">Backbord negativ</text>
    </g>
    <text x="56" y="832" class="small">Kurs-/Abdriftwinkel nur bei gültiger Richtungsauflösung</text>
  </g>

  <g id="wind_card" filter="url(#shadow)">
    <rect x="1018" y="626" width="390" height="230" rx="18" fill="#122434" stroke="#516373" stroke-width="1.2" stroke-dasharray="7 6"/>
    <text x="1042" y="659" class="card-title">WIND · VORBEREITET</text>
    <g id="wind_unavailable">
      <circle cx="1213" cy="724" r="33" fill="#0b1c2a" stroke="#506373" stroke-width="1.5"/>
      <path d="M1197 724h32" stroke="#8296a4" stroke-width="2"/>
      <text x="1213" y="783" text-anchor="middle" class="secondary muted">Noch kein Windzustand</text>
      <text x="1213" y="810" text-anchor="middle" class="caption">TWS · TWD · AWS · AWA · TWA</text>
      <text x="1213" y="835" text-anchor="middle" class="small">Keine Zahlen statt fehlender Daten</text>
    </g>
  </g>

  <text x="720" y="883" text-anchor="middle" class="small">SegelPhysik · UI-Konzept v0.7 · Beispielwerte sind keine Mess- oder Simulationsergebnisse</text>
</svg>
