[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "pybind11>=3.0,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "segelphysik-native"
version = "0.10.0"
description = "Native C++-Anbindung fuer SegelPhysik"
requires-python = ">=3.14"

[tool.scikit-build]
cmake.source-dir = "code/cpp"
cmake.build-type = "Release"
build-dir = "build/native/{wheel_tag}"
wheel.packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "code/cpp/tests"]
python_files = ["test_*.py", "paritaet_*.py", "vertrag_native.py"]
addopts = "--strict-markers"
markers = [
    "integration: prueft einen Vertrag ueber mehrere Komponenten",
    "gui: benoetigt eine Qt-Anwendung oder einen echten Renderkontext",
    "native: benoetigt den gebauten nativen C++-Backend",
    "slow: in der V0.12-Baseline mindestens eine Sekunde Call-Laufzeit",
    "performance: gezielte Laufzeitmessung, keine reine Werkzeugkorrektheit",
    "hardware: benoetigt ein reales optionales Geraet, kein Mock",
    "diagnostic: erhaltener modellspezifischer Fehler-/Bestandsnachweis",
]
