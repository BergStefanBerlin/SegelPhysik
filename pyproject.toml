[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "pybind11>=3.0,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "segelphysik-native"
version = "0.10.0"
description = "Native C++-Anbindung fuer SegelPhysik"
requires-python = ">=3.14"

[tool.scikit-build]
cmake.source-dir = "code/cpp"
cmake.build-type = "Release"
build-dir = "build/native/{wheel_tag}"
wheel.packages = []
